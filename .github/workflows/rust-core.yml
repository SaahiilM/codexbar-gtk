name: Rust core

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "rust-core/**"
      - "rust-python/**"
      - "rust-backend/**"
      - "rust-gtk/**"
      - "codexbar_gtk/assets/provider_icons/**"
      - "scripts/smoke-native-gtk.sh"
      - "scripts/smoke-native-dashboard.sh"
      - "scripts/smoke-native-wayland-assets.sh"
      - "scripts/smoke-native-usage-pages.sh"
      - "scripts/smoke-native-settings.sh"
      - "scripts/build-native.sh"
      - "scripts/install-native.sh"
      - "scripts/smoke-native-install.sh"
      - "scripts/native/**"
      - "rust-gtk/tests/python_free_linkage.rs"
      - "rust-gtk/tests/svg_loader_negative.rs"
      - "scripts/native/render_activation.sh"
      - "scripts/capture-native-gtk-wayland.sh"
      - "codexbar_gtk/providers.py"
      - "codexbar_gtk/activity.py"
      - "codexbar_gtk/format.py"
      - "codexbar_gtk/pace.py"
      - "codexbar_gtk/history.py"
      - "codexbar_gtk/charts.py"
      - "codexbar_gtk/rust_bridge.py"
      - "codexbar_gtk/ui/app.py"
      - "codexbar_gtk/ui/settings.py"
      - "codexbar_gtk/ui/tray.py"
      - "scripts/build-rust-core.sh"
      - "tests/**"
      - ".github/workflows/rust-core.yml"

jobs:
  tray-dbus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install D-Bus test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-daemon python3-dbus python3-gi
      - name: Verify tray update signals on a private session bus
        run: /usr/bin/python3 -m unittest discover -s tests -p test_tray_signals.py -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native GTK build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev librsvg2-common xvfb xauth xdotool x11-utils x11-apps xfwm4 ffmpeg libglib2.0-bin dbus-daemon python3-dbus python3-gi
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path rust-core/Cargo.toml -- --check
          cargo fmt --manifest-path rust-python/Cargo.toml -- --check
          cargo fmt --manifest-path rust-backend/Cargo.toml -- --check
          cargo fmt --manifest-path rust-gtk/Cargo.toml -- --check
      - name: Run Rust core tests
        run: cargo test --manifest-path rust-core/Cargo.toml --locked
      - name: Run headless backend contract tests
        run: cargo test --manifest-path rust-backend/Cargo.toml --locked
      - name: Test native GTK bootstrap contracts
        run: dbus-run-session -- cargo test --manifest-path rust-gtk/Cargo.toml --locked
      - name: Test provider artwork decode fallback on X11
        run: xvfb-run -a dbus-run-session -- cargo test --manifest-path rust-gtk/Cargo.toml --locked --lib provider_artwork_prefers_decodable_brand_then_monochrome_then_label -- --ignored
      - name: Smoke provider artwork decoding and accessibility roles on X11
        run: xvfb-run -a dbus-run-session -- cargo test --manifest-path rust-gtk/Cargo.toml --locked --test a11y_assets -- --ignored
      - name: Build PyO3 extension
        run: ./scripts/build-rust-core.sh
      - name: Run Python tests with default backend
        run: python3 -m unittest discover -s tests -v
      - name: Run Python tests with Rust backend
        run: CODEXBAR_RUST_CORE=1 python3 -m unittest discover -s tests -v
      - name: Run Clippy
        run: |
          cargo clippy --manifest-path rust-core/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path rust-python/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path rust-backend/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path rust-gtk/Cargo.toml --all-targets -- -D warnings
      - name: Build native GTK application
        run: cargo build --manifest-path rust-gtk/Cargo.toml --locked --bin codexbar-gtk-native
      - name: Exercise Gio routing and async in-flight shutdown
        run: ./scripts/smoke-native-gtk.sh
      - name: Exercise SNI panel toggle/open semantics and refresh preference
        run: ./scripts/smoke-native-panel-parity.sh
      - name: Exercise the native dashboard with synthetic provider data
        run: ./scripts/smoke-native-dashboard.sh
      - name: Exercise native dashboard keyboard navigation at 2x display scale
        run: NATIVE_GTK_SCALE=2 ./scripts/smoke-native-dashboard.sh
      - name: Exercise native Spend and Sessions with synthetic data
        run: ./scripts/smoke-native-usage-pages.sh
      - name: Build native release artifact (C01 prototype)
        run: |
          cargo build --manifest-path rust-gtk/Cargo.toml --locked --release --bin codexbar-gtk-native
      - name: Exercise isolated native install/uninstall/upgrade/rollback smoke
        run: ./scripts/smoke-native-install.sh
      - name: Verify native binary has no Python linkage (linkage inspection only, C02 unproven)
        run: cargo test --manifest-path rust-gtk/Cargo.toml --locked --test python_free_linkage
      # Keep the comprehensive Settings smoke available for local verification.
      # Its fixed-coordinate native file chooser interaction failed twice in
      # CI at different points; the other native GTK Xvfb smokes remain enabled.

  python-free-runtime-proof:
    # Match the runtime image ABI; do not build against a moving newer distro.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev librsvg2-common
      - name: Build same-commit debug and release application artifacts
        run: |
          cargo build --manifest-path rust-gtk/Cargo.toml --locked --bin codexbar-gtk-native --message-format=json-render-diagnostics > "$RUNNER_TEMP/native-debug.json"
          cargo build --manifest-path rust-gtk/Cargo.toml --locked --release --bin codexbar-gtk-native --message-format=json-render-diagnostics > "$RUNNER_TEMP/native-release.json"
          native_debug="$(python3 scripts/native/no-python/cargo-artifact.py --json "$RUNNER_TEMP/native-debug.json" --target codexbar-gtk-native)"
          printf 'NATIVE_DEBUG=%s\n' "$native_debug" >> "$GITHUB_ENV"
          native_release="$(python3 scripts/native/no-python/cargo-artifact.py --json "$RUNNER_TEMP/native-release.json" --target codexbar-gtk-native)"
          printf 'NATIVE_RELEASE=%s\n' "$native_release" >> "$GITHUB_ENV"
      - name: Build SVG accessibility test executable without running host GUI
        run: |
          cargo test --manifest-path rust-gtk/Cargo.toml --locked --test a11y_assets --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/a11y-assets.json"
          svg_test_binary="$(python3 scripts/native/no-python/cargo-artifact.py --json "$RUNNER_TEMP/a11y-assets.json" --target a11y_assets)"
          printf 'SVG_TEST_BINARY=%s\n' "$svg_test_binary" >> "$GITHUB_ENV"
      - name: Run installed-prefix and Python-free runtime proof in Docker
        run: |
          ./scripts/smoke-native-no-python.sh \
            --artifact "$NATIVE_DEBUG" \
            --installer-source "$GITHUB_WORKSPACE" \
            --debug-artifact "$NATIVE_DEBUG" \
            --release-artifact "$NATIVE_RELEASE" \
            --svg-test-binary "$SVG_TEST_BINARY" \
            --require-docker \
            --evidence-dir "$RUNNER_TEMP/no-python-evidence"
      - name: Retain sanitized synthetic proof log and hashes on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-free-runtime-proof-failure
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/no-python-evidence/run.log
            ${{ runner.temp }}/no-python-evidence/result.txt
            ${{ runner.temp }}/no-python-evidence/work/image-id.txt
            ${{ runner.temp }}/no-python-evidence/work/lifecycle-artifacts.sha256
            ${{ runner.temp }}/no-python-evidence/work/installer-source.sha256
