name: Rust core

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "rust-core/**"
      - ".github/workflows/rust-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust-core/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path rust-core/Cargo.toml --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets --all-features -- -D warnings
