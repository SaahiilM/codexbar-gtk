name: Rust core

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "rust-core/**"
      - "rust-backend/**"
      - "rust-gtk/**"
      - "rust-ui-test-tools/**"
      - "rust-ci-tools/**"
      - "rust-smoke-fixtures/**"
      - "scripts/build-rust-smoke-fixtures.sh"
      - "scripts/smoke-native-panel-parity.sh"
      - "assets/provider_icons/**"
      - "scripts/smoke-native-gtk.sh"
      - "scripts/smoke-native-dashboard.sh"
      - "scripts/smoke-native-wayland-assets.sh"
      - "scripts/smoke-native-usage-pages.sh"
      - "scripts/smoke-native-settings.sh"
      - "scripts/test-native-wayland-isolated.py"
      - "scripts/select-native-file-chooser.py"
      - "scripts/native_atspi_rows.py"
      - "scripts/build-native.sh"
      - "scripts/test-run-native.sh"
      - "run.sh"
      - "scripts/run-native.sh"
      - "scripts/install.sh"
      - "scripts/install-native.sh"
      - "scripts/smoke-native-install.sh"
      - "scripts/native/**"
      - "scripts/native/no-python/cargo-artifact"
      - "rust-gtk/tests/python_free_linkage.rs"
      - "rust-gtk/tests/svg_loader_negative.rs"
      - "scripts/native/render_activation.sh"
      - "scripts/test-native-activation-renderer.sh"
      - "scripts/capture-native-gtk-wayland.sh"
      - "scripts/test-native-harness-units.sh"
      - "scripts/test-native-tray-dbus.sh"
      - "tests/**"
      - ".github/workflows/rust-core.yml"

jobs:
  tray-dbus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native GTK and D-Bus test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev dbus-daemon
      - name: Verify native tray protocol on a private session bus
        run: ./scripts/test-native-tray-dbus.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check CI helper formatting
        run: cargo fmt --manifest-path rust-ci-tools/Cargo.toml -- --check
      - name: Test CI helper behavior
        run: cargo test --manifest-path rust-ci-tools/Cargo.toml --locked
      - name: Lint CI helper strictly
        run: cargo clippy --manifest-path rust-ci-tools/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Install native GTK build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev librsvg2-common xvfb xauth xdotool x11-utils x11-apps xfwm4 ffmpeg libglib2.0-bin dbus-daemon python3-dbus python3-gi weston wayland-utils at-spi2-core gir1.2-atspi-2.0
      - name: Check Rust smoke fixtures
        run: |
          cargo fmt --manifest-path rust-smoke-fixtures/Cargo.toml -- --check
          cargo test --manifest-path rust-smoke-fixtures/Cargo.toml --locked
          cargo clippy --manifest-path rust-smoke-fixtures/Cargo.toml --locked --all-targets -- -D warnings
          ./scripts/build-rust-smoke-fixtures.sh
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path rust-core/Cargo.toml -- --check
          cargo fmt --manifest-path rust-backend/Cargo.toml -- --check
          cargo fmt --manifest-path rust-gtk/Cargo.toml -- --check
          cargo fmt --manifest-path rust-ui-test-tools/Cargo.toml -- --check
      - name: Run Rust core tests
        run: cargo test --manifest-path rust-core/Cargo.toml --locked
      - name: Run headless backend contract tests
        run: cargo test --manifest-path rust-backend/Cargo.toml --locked
      - name: Test native GTK bootstrap contracts
        run: dbus-run-session -- cargo test --manifest-path rust-gtk/Cargo.toml --locked
      - name: Test provider artwork decode fallback on X11
        run: xvfb-run -a dbus-run-session -- cargo test --manifest-path rust-gtk/Cargo.toml --locked --lib provider_artwork_prefers_decodable_brand_then_monochrome_then_label -- --ignored
      - name: Smoke provider artwork decoding and accessibility roles on X11
        run: xvfb-run -a dbus-run-session -- cargo test --manifest-path rust-gtk/Cargo.toml --locked --test a11y_assets -- --ignored
      - name: Verify rendered Claude warning and quota labels on X11
        run: xvfb-run -a dbus-run-session -- cargo test --manifest-path rust-gtk/Cargo.toml --locked --lib rendered_dashboard_contains_safe_warning_and_both_quotas -- --ignored
      - name: Verify empty dashboard Settings action on X11
        run: xvfb-run -a dbus-run-session -- cargo test --manifest-path rust-gtk/Cargo.toml --locked --lib empty_dashboard_offers_settings_action -- --ignored
      - name: Run retained native automation harness unit tests
        run: ./scripts/test-native-harness-units.sh
      - name: Run Clippy
        run: |
          cargo clippy --manifest-path rust-core/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path rust-backend/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path rust-gtk/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust-ui-test-tools/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Test Rust UI automation tool
        run: cargo test --manifest-path rust-ui-test-tools/Cargo.toml --locked
      - name: Build Rust UI automation tool
        run: cargo build --manifest-path rust-ui-test-tools/Cargo.toml --locked --bin codexbar-ui-test-tool
      - name: Build native GTK application
        run: cargo build --manifest-path rust-gtk/Cargo.toml --locked --bin codexbar-gtk-native
      - name: Exercise Gio routing and async in-flight shutdown
        run: ./scripts/smoke-native-gtk.sh
      - name: Exercise SNI panel toggle/open semantics and refresh preference
        run: ./scripts/smoke-native-panel-parity.sh
      - name: Exercise the native dashboard with synthetic provider data
        run: ./scripts/smoke-native-dashboard.sh
      - name: Exercise native dashboard keyboard navigation at 2x display scale
        run: NATIVE_GTK_SCALE=2 ./scripts/smoke-native-dashboard.sh
      - name: Exercise native GTK routes and actions on private Weston Wayland
        timeout-minutes: 6
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/native-wayland-evidence"
          rust-ui-test-tools/target/debug/codexbar-ui-test-tool isolated-wayland \
            --binary rust-gtk/target/debug/codexbar-gtk-native \
            --artifact-dir "$RUNNER_TEMP/native-wayland-evidence"
      - name: Exercise native Settings advanced actions on private Weston Wayland
        timeout-minutes: 6
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/native-wayland-advanced-evidence"
          rust-ui-test-tools/target/debug/codexbar-ui-test-tool isolated-wayland \
            --scenario advanced \
            --binary rust-gtk/target/debug/codexbar-gtk-native \
            --artifact-dir "$RUNNER_TEMP/native-wayland-advanced-evidence"
      - name: Exercise residual native Settings switches on private Weston Wayland
        timeout-minutes: 6
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/native-wayland-settings-residual-evidence"
          rust-ui-test-tools/target/debug/codexbar-ui-test-tool isolated-wayland \
            --scenario settings-residual \
            --binary rust-gtk/target/debug/codexbar-gtk-native \
            --artifact-dir "$RUNNER_TEMP/native-wayland-settings-residual-evidence"
      - name: Exercise native page state and navigation on private Weston Wayland
        timeout-minutes: 6
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/native-wayland-page-state-evidence"
          rust-ui-test-tools/target/debug/codexbar-ui-test-tool isolated-wayland \
            --scenario page-state \
            --binary rust-gtk/target/debug/codexbar-gtk-native \
            --artifact-dir "$RUNNER_TEMP/native-wayland-page-state-evidence"
      - name: Exercise native Spend and Sessions with synthetic data
        run: ./scripts/smoke-native-usage-pages.sh
      - name: Exercise native Settings interactions with synthetic data
        timeout-minutes: 15
        run: ./scripts/smoke-native-settings.sh
      - name: Build native release artifact (C01 prototype)
        run: |
          cargo build --manifest-path rust-gtk/Cargo.toml --locked --release --bin codexbar-gtk-native
      - name: Exercise isolated native install/uninstall/upgrade/rollback smoke
        run: ./scripts/smoke-native-install.sh
      - name: Verify default source-tree native launcher argv and failures
        run: ./scripts/test-run-native.sh
      - name: Verify native binary has no Python linkage (linkage inspection only, C02 unproven)
        run: cargo test --manifest-path rust-gtk/Cargo.toml --locked --test python_free_linkage
      - name: Retain synthetic private Wayland smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-wayland-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-wayland-evidence/
      - name: Retain synthetic advanced Wayland Settings evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-wayland-advanced-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-wayland-advanced-evidence/
      - name: Retain synthetic residual Settings evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-wayland-settings-residual-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-wayland-settings-residual-evidence/
      - name: Retain synthetic page-state Wayland evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-wayland-page-state-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-wayland-page-state-evidence/

  python-free-runtime-proof:
    # Match the runtime image ABI; do not build against a moving newer distro.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CI resolver for the Ubuntu 24.04 runtime ABI
        run: |
          cargo build --manifest-path rust-ci-tools/Cargo.toml --locked --release --bin codexbar-ci-tool
          printf 'CODEXBAR_CI_TOOL=%s/rust-ci-tools/target/release/codexbar-ci-tool\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev librsvg2-common
      - name: Build same-commit debug and release application artifacts
        run: |
          cargo build --manifest-path rust-gtk/Cargo.toml --locked --bin codexbar-gtk-native --message-format=json-render-diagnostics > "$RUNNER_TEMP/native-debug.json"
          cargo build --manifest-path rust-gtk/Cargo.toml --locked --release --bin codexbar-gtk-native --message-format=json-render-diagnostics > "$RUNNER_TEMP/native-release.json"
          native_debug="$(scripts/native/no-python/cargo-artifact --json "$RUNNER_TEMP/native-debug.json" --target codexbar-gtk-native)"
          printf 'NATIVE_DEBUG=%s\n' "$native_debug" >> "$GITHUB_ENV"
          native_release="$(scripts/native/no-python/cargo-artifact --json "$RUNNER_TEMP/native-release.json" --target codexbar-gtk-native)"
          printf 'NATIVE_RELEASE=%s\n' "$native_release" >> "$GITHUB_ENV"
      - name: Build SVG accessibility test executable without running host GUI
        run: |
          cargo test --manifest-path rust-gtk/Cargo.toml --locked --test a11y_assets --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/a11y-assets.json"
          svg_test_binary="$(scripts/native/no-python/cargo-artifact --json "$RUNNER_TEMP/a11y-assets.json" --target a11y_assets)"
          printf 'SVG_TEST_BINARY=%s\n' "$svg_test_binary" >> "$GITHUB_ENV"
      - name: Run installed-prefix and Python-free runtime proof in Docker
        run: |
          ./scripts/smoke-native-no-python.sh \
            --artifact "$NATIVE_DEBUG" \
            --installer-source "$GITHUB_WORKSPACE" \
            --debug-artifact "$NATIVE_DEBUG" \
            --release-artifact "$NATIVE_RELEASE" \
            --svg-test-binary "$SVG_TEST_BINARY" \
            --require-docker \
            --evidence-dir "$RUNNER_TEMP/no-python-evidence"
      - name: Verify activated command targets across native build upgrade and rollback
        timeout-minutes: 25
        run: |
          previous_commit=41d2fcf982aef52cd86a64cb769176b494abb63c
          git fetch --no-tags --depth=1 origin "$previous_commit"
          mkdir -p "$RUNNER_TEMP/native-service-dependencies"
          git archive "$previous_commit" | tar -x -C "$RUNNER_TEMP/native-service-dependencies"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/native-service-dependencies/rust-gtk/Cargo.toml"
          SMOKE_EVIDENCE="$RUNNER_TEMP/native-service-evidence" ./scripts/smoke-native-service.sh
      - name: Retain synthetic native command-target proof results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-command-target-proof-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-service-evidence/run.log
            ${{ runner.temp }}/native-service-evidence/source-sha256.txt
            ${{ runner.temp }}/native-service-evidence/work/docker-build.log
      - name: Retain sanitized synthetic proof log and hashes on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-free-runtime-proof-failure
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/no-python-evidence/run.log
            ${{ runner.temp }}/no-python-evidence/result.txt
            ${{ runner.temp }}/no-python-evidence/work/image-id.txt
            ${{ runner.temp }}/no-python-evidence/work/lifecycle-artifacts.sha256
            ${{ runner.temp }}/no-python-evidence/work/installer-source.sha256
