[package]
name = "codexbar-backend"
version = "0.1.0"
edition = "2021"
description = "Headless asynchronous services for codexbar-gtk"

[lib]
name = "codexbar_backend"
path = "src/lib.rs"

[dependencies]
codexbar-core = { path = "../rust-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
portable-pty = "0.9.0"

[dev-dependencies]
