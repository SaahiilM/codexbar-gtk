[package]
name = "codexbar-python-bridge"
version = "0.1.0"
edition = "2021"
description = "PyO3 bridge from the GTK Python frontend to codexbar-core"

[lib]
name = "_rust_core"
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4"
codexbar-core = { path = "../rust-core" }
codexbar-backend = { path = "../rust-backend" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
