[package]
name = "codexbar-ui-test-tools"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "codexbar-ui-test-tool"
path = "src/main.rs"

[dependencies]
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "fs", "io-util", "net", "sync", "signal"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
